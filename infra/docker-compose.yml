services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alreadycovered
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in infra/.env}"
      POSTGRES_DB: alreadycovered
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alreadycovered"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped
    # No GPU on this VPS - CPU inference only. See internal/DECISIONS.md.

  api:
    build:
      context: ../
      dockerfile: apps/service/Dockerfile
    environment:
      PORT: "4173"
      DATABASE_URL: "postgres://alreadycovered:${DB_PASSWORD}@db:5432/alreadycovered"
      STORAGE_ROOT: /data/storage
      CORS_ORIGIN: "${CORS_ORIGIN}"
      COOKIE_CROSS_SITE: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-gemma4:e2b}"
      LOG_LEVEL: info
    volumes: [storage:/data/storage]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  # Dedicated Caddy on its own ports (8080/8443) - the VPS's shared Caddy
  # instance (another project) already owns 80/443, and attempting to add a
  # site block to that shared Caddyfile hit an unresolved bind-mount
  # propagation issue (see internal/DECISIONS.md), so this stays fully
  # independent instead of risking a resource shared with another project.
  caddy:
    image: caddy:2-alpine
    ports: ["8080:8080", "8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
  storage:
  caddy_data:
  caddy_config:
