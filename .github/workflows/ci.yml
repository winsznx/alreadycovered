name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/shared must be built before apps/service or apps/web can
      # resolve its types - see internal note on this in the Dockerfile.
      - run: pnpm --filter @alreadycovered/shared build

      - run: pnpm typecheck

      # Unit tests only: integration/e2e/eval tests need a local Postgres
      # and/or a running Ollama instance and are not run in CI - see
      # CONTRIBUTING.md for how to run those before sending a PR.
      - run: pnpm test:unit
